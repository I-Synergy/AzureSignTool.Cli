# SonarCloud analysis scope.
#
# `.ai/` contains the AI template, its example projects and vendored Hugo themes. Those
# files are documentation/tooling assets, not the shipped CLI, and analysing them buries
# the product findings under ~1,200 template diagnostics.
sonar.projectKey=I-Synergy_AzureSignTool.Cli
sonar.organization=i-synergy-github
sonar.exclusions=.ai/**,**/bin/**,**/obj/**,packages/**,.pytest_cache/**
sonar.cpd.exclusions=.ai/**
