# Build, test, pack, sign and publish AzureSignTool.Cli.
# Replaces azure-pipelines.yml (Azure DevOps); same shape as the I-Synergy.Framework CI.
#
# Release versioning follows I-Synergy/AI: the build number is YYYY.1MMdd.1HHmm in UTC, the
# tag and GitHub release use that number with no `v` prefix, and no file is bumped. A manual
# workflow_dispatch run accepts an optional build_number; an existing tag is skipped.
#
# Repository/environment variables (Settings → Variables), all optional except the release ones:
#   BUILD_CONFIGURATION       - build configuration (default Release)
#   AZURE_CLIENT_ID           - service principal/app registration id   (release, OIDC)
#   AZURE_TENANT_ID           - Entra ID tenant id                      (release, OIDC)
#   AZURE_KEYVAULT_URI        - Key Vault URI; when unset, signing is skipped
#   AZURE_SIGNING_CERTIFICATE - certificate name inside the Key Vault   (release)
#   TIMESTAMP_URL             - RFC 3161 timestamp server               (release)
#
# Repository secrets:
#   NUGET_USER                - nuget.org profile name for trusted publishing (`ismailhassani`)
#
# Environments (Settings → Environments):
#   production - approval gate for a release published from `main`
# scripts/Set-GitHubSettings.ps1 creates it and adds required reviewers.
# nuget.org trusted publishing pins the environment name the publishing job runs in.
#
# Pull requests build, test and pack only; they never publish.
#
# Create them all at once with: ./scripts/Set-GitHubSettings.ps1
#
# The CLI is packed as a self-contained tool: one package per RID (win-x64, win-arm64, linux-x64)
# plus a small pointer package. Consumers therefore need a .NET 10+ CLI to install, but no .NET
# runtime to run it. RID packages must be pushed before the pointer package.
#
# Signing unpacks the win-x64 package built by this same workflow and runs its self-contained
# executable, so the release job installs no .NET and does not depend on a published package.
# The only .NET use in the release job is `dotnet nuget push`, which the runner image provides.
# It runs from RUNNER_TEMP because global.json pins SDK 11.0.100, which the image may not have.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (YYYY.1MMdd.1HHmm). Leave empty to use the current UTC time.'
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION || 'Release' }}

jobs:
  build:
    name: Build, test and pack
    # A superseded build has no side effects, so a new push cancels it instead of queueing
    # behind it. The release job has its own group and is never cancelled.
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    # Everything except the native signing calls is platform-neutral, so build/test/pack run on
    # Linux. The Windows-only signing tests skip themselves via [OSCondition]; the release job
    # below stays on Windows because AzureSignTool P/Invokes mssign32/crypt32.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      buildNumber: ${{ steps.version.outputs.buildNumber }}
      versionPackage: ${{ steps.version.outputs.VersionPackage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        shell: pwsh
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_REASON: ${{ github.event_name == 'pull_request' && 'PullRequest' || github.event_name == 'workflow_dispatch' && 'Manual' || 'Merge' }}
        run: |
          $buildNumber = $env:INPUT_BUILD_NUMBER
          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
              $now = [DateTime]::UtcNow
              $buildNumber = '{0}.1{1}.1{2}' -f $now.ToString('yyyy'), $now.ToString('MMdd'), $now.ToString('HHmm')
          }

          if ($buildNumber -notmatch '^\d{4}\.1\d{4}\.1\d{4}(\.\d{1,2})?$') {
              throw "Invalid build number '$buildNumber'. Expected YYYY.1MMdd.1HHmm."
          }

          ./scripts/Set-VersionVariables.ps1 -BuildNumber $buildNumber -BuildReason $env:BUILD_REASON
          Add-Content -Path $env:GITHUB_OUTPUT -Value "buildNumber=$buildNumber"

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        shell: pwsh
        run: >
          dotnet restore AzureSignTool.Cli.slnx
          -p:Configuration=$env:BUILD_CONFIGURATION
          -p:GeneratePackageOnBuild=false
          -nodeReuse:false

      # Directory.Build.props leaves release versions unset; the workflow is the single source of
      # truth for Version, AssemblyVersion, FileVersion and InformationalVersion.
      - name: Build
        shell: pwsh
        run: >
          dotnet build AzureSignTool.Cli.slnx
          -c $env:BUILD_CONFIGURATION
          --no-restore
          -p:Version=${{ steps.version.outputs.VersionPackage }}
          -p:AssemblyVersion=${{ steps.version.outputs.VersionNumber }}
          -p:FileVersion=${{ steps.version.outputs.VersionNumber }}
          -p:InformationalVersion=${{ steps.version.outputs.VersionInformational }}
          -p:PackageVersion=${{ steps.version.outputs.VersionPackage }}
          -p:ContinuousIntegrationBuild=true
          -p:GeneratePackageOnBuild=false
          -nodeReuse:false

      - name: Audit for vulnerable packages
        shell: pwsh
        run: dotnet list AzureSignTool.Cli.slnx package --vulnerable --include-transitive

      # The tool is packed self-contained per RID (see AzureSignTool.Cli.csproj), so pack publishes
      # win-x64, win-arm64 and linux-x64 and produces one package per RID plus a small pointer
      # package. That publish cannot be skipped with --no-build.
      - name: Pack
        shell: pwsh
        run: >
          dotnet pack AzureSignTool.Cli.slnx
          -c $env:BUILD_CONFIGURATION
          -p:Version=${{ steps.version.outputs.VersionPackage }}
          -p:AssemblyVersion=${{ steps.version.outputs.VersionNumber }}
          -p:FileVersion=${{ steps.version.outputs.VersionNumber }}
          -p:InformationalVersion=${{ steps.version.outputs.VersionInformational }}
          -p:PackageVersion=${{ steps.version.outputs.VersionPackage }}
          -p:ContinuousIntegrationBuild=true
          -o packages

      # Shape check for the self-contained RID tool packages. The pointer package must name every
      # RID, each RID package must carry an apphost plus the bundled runtime, and no package may be
      # framework-dependent — that is the guarantee consumers rely on (no .NET install needed).
      - name: Verify packages
        shell: pwsh
        run: |
          $expectedRids = @('win-x64', 'win-arm64', 'linux-x64')
          $nupkgs = @(Get-ChildItem -Path 'packages' -Filter *.nupkg)
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Get-PackageEntries([string] $path) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
            try { return @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          }

          function Get-PackageEntryText([string] $path, [string] $entryName) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
            try {
              $entry = $zip.GetEntry($entryName)
              if (-not $entry) { return $null }
              $reader = New-Object System.IO.StreamReader($entry.Open())
              try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
            }
            finally { $zip.Dispose() }
          }

          $pointer = @($nupkgs | Where-Object { $_.BaseName -match '^AzureSignTool\.Cli\.\d' })
          if ($pointer.Count -ne 1) {
            throw "Expected a single AzureSignTool.Cli pointer package, found $($pointer.Count)."
          }
          if ($nupkgs.Count -ne (1 + $expectedRids.Count)) {
            throw "Expected $(1 + $expectedRids.Count) packages, found $($nupkgs.Count): $($nupkgs.Name -join ', ')."
          }

          $settings = Get-PackageEntryText $pointer[0].FullName 'tools/any/any/DotnetToolSettings.xml'
          if (-not $settings) { throw "$($pointer[0].Name) has no tools/any/any/DotnetToolSettings.xml." }
          foreach ($rid in $expectedRids) {
            if ($settings -notmatch "RuntimeIdentifier=`"$rid`"") {
              throw "$($pointer[0].Name) does not declare the $rid package."
            }
          }

          foreach ($rid in $expectedRids) {
            $package = @($nupkgs | Where-Object { $_.BaseName -like "AzureSignTool.Cli.$rid.*" })
            if ($package.Count -ne 1) { throw "Expected one AzureSignTool.Cli.$rid package, found $($package.Count)." }

            $entries = Get-PackageEntries $package[0].FullName
            if (-not ($entries -contains "tools/any/$rid/DotnetToolSettings.xml")) {
              throw "$($package[0].Name) is missing tools/any/$rid/DotnetToolSettings.xml."
            }
            # The bundled core library is what makes the package self-contained.
            if (-not ($entries -contains "tools/any/$rid/System.Private.CoreLib.dll")) {
              throw "$($package[0].Name) does not bundle the .NET runtime (System.Private.CoreLib.dll)."
            }

            $runtimeConfig = Get-PackageEntryText $package[0].FullName "tools/any/$rid/AzureSignTool.runtimeconfig.json"
            if (-not $runtimeConfig) { throw "$($package[0].Name) is missing its runtimeconfig.json." }
            if ($runtimeConfig -match '"framework"') {
              throw "$($package[0].Name) is framework-dependent; it must declare includedFrameworks."
            }
          }

          Write-Host "Verified $($pointer[0].Name) + $($expectedRids -join ', '): self-contained RID tool packages."

      - name: Test
        shell: pwsh
        run: |
          dotnet test AzureSignTool.Cli.slnx `
            -c $env:BUILD_CONFIGURATION `
            --no-build `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release packages
    needs: build
    # Never cancel a job that may be mid-push to NuGet.org or mid-release: queue instead.
    concurrency:
      group: ci-release-${{ github.ref }}
      cancel-in-progress: false
    # `main` publishes a release through `production`. Pull requests stop after the build job.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: production
    timeout-minutes: 60
    permissions:
      contents: write   # push the release tag
      id-token: write   # OIDC to Azure Key Vault and nuget.org
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release tag
        id: release_tag
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.buildNumber }}
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:BUILD_NUMBER"
          if (-not [string]::IsNullOrWhiteSpace($existing)) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Tag $env:BUILD_NUMBER already exists; skipping tag and release."
          }
          else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      # No .NET is installed here on purpose: the signing tool is the self-contained win-x64 binary
      # from the package built in this same run, and `dotnet nuget push` is a CLI command the
      # windows-2025 image already provides.
      - name: Validate publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'The NUGET_USER secret is not set. Trusted publishing cannot log in to nuget.org. Run scripts/Set-GitHubSettings.ps1 or: gh secret set NUGET_USER --repo ${{ github.repository }} --body ismailhassani'
          }

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      # Sign with the exact binary that ships: the win-x64 package is self-contained, so no .NET
      # runtime (and no previously published package) is involved.
      - name: Extract signing tool
        if: vars.AZURE_KEYVAULT_URI != ''
        shell: pwsh
        run: |
          $package = @(Get-ChildItem -Path 'packages' -Filter 'AzureSignTool.Cli.win-x64.*.nupkg')
          if ($package.Count -ne 1) {
            throw "Expected one AzureSignTool.Cli.win-x64 package, found $($package.Count)."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package[0].FullName, 'signing-tool')
          if (-not (Test-Path 'signing-tool/tools/any/win-x64/AzureSignTool.exe')) {
            throw "$($package[0].Name) does not contain tools/any/win-x64/AzureSignTool.exe."
          }

      # The signing app has no subscription role: it reaches the vault through its access policy.
      # azure/login insists on finding a subscription, so the OIDC token is requested directly and
      # handed to WorkloadIdentityCredential through the environment it documents.
      - name: Acquire federated token
        if: vars.AZURE_KEYVAULT_URI != ''
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:RUNNER_TEMP 'azure-federated-token'
          $response = Invoke-RestMethod `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          Set-Content -Path $tokenPath -Value $response.value -NoNewline

          @(
            "AZURE_FEDERATED_TOKEN_FILE=$tokenPath"
            "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}"
            "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Federated token written to $tokenPath"

      - name: Sign NuGet packages
        if: vars.AZURE_KEYVAULT_URI != ''
        shell: pwsh
        env:
          KEY_VAULT_URI: ${{ vars.AZURE_KEYVAULT_URI }}
          SIGNING_CERTIFICATE: ${{ vars.AZURE_SIGNING_CERTIFICATE }}
          TIMESTAMP_URL: ${{ vars.TIMESTAMP_URL }}
        run: |
          & "$env:GITHUB_WORKSPACE\signing-tool\tools\any\win-x64\AzureSignTool.exe" sign `
            -kvu "$env:KEY_VAULT_URI" `
            -kvc "$env:SIGNING_CERTIFICATE" `
            -act WorkloadIdentityCredential `
            --timestamp-rfc3161 "$env:TIMESTAMP_URL" `
            -td sha256 -v `
            --sign-nuget-contents `
            --sign-nuget-contents-filter "AzureSignTool*" `
            (Get-ChildItem -Path 'packages' -Filter *.nupkg).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package signing failed.' }

      - name: Warn about unsigned packages
        if: vars.AZURE_KEYVAULT_URI == ''
        shell: pwsh
        run: |
          Write-Warning 'AZURE_KEYVAULT_URI is not set: packages will be published unsigned. Set the signing variables on the repository to sign them.'

      - name: NuGet login (trusted publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # NuGet resolves a RID-specific tool through the pointer package, so every RID package must
      # exist in the feed before the pointer is pushed; otherwise installs fail mid-publish.
      #
      # `dotnet nuget push` needs an SDK, and global.json pins 11.0.100 for building — which the
      # runner image may not have. It therefore runs from RUNNER_TEMP, outside the repository, so
      # the pinned SDK is not consulted and any installed CLI can push the already-built packages.
      - name: Push packages to NuGet.org
        shell: pwsh
        run: |
          $nupkgs = @(Get-ChildItem -Path 'packages' -Filter *.nupkg)
          $pointer = @($nupkgs | Where-Object { $_.BaseName -match '^AzureSignTool\.Cli\.\d' })
          $ridPackages = @($nupkgs | Where-Object { $_.BaseName -notmatch '^AzureSignTool\.Cli\.\d' })
          if ($pointer.Count -ne 1) {
            throw "Expected exactly one AzureSignTool.Cli pointer package, found $($pointer.Count)."
          }

          Push-Location $env:RUNNER_TEMP
          try {
            Write-Host "Pushing with .NET CLI $(& dotnet --version)"
            foreach ($package in @($ridPackages + $pointer)) {
              Write-Host "Pushing $($package.Name)"
              dotnet nuget push $package.FullName `
                --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($package.Name)" }
            }
          }
          finally {
            Pop-Location
          }

      - name: Create git tag
        if: steps.release_tag.outputs.skip != 'true'
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ needs.build.outputs.buildNumber }}
          SOURCE_VERSION: ${{ github.sha }}
        run: >
          ./scripts/New-GitTag.ps1
          -BuildNumber $env:BUILD_NUMBER
          -SourceVersion $env:SOURCE_VERSION
          -UserEmail 'github-actions[bot]@users.noreply.github.com'
          -UserName 'github-actions[bot]'

      - name: Create GitHub release
        if: steps.release_tag.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.build.outputs.buildNumber }}
          VERSION_PACKAGE: ${{ needs.build.outputs.versionPackage }}
        run: |
          gh release create "$env:BUILD_NUMBER" `
            --title "$env:BUILD_NUMBER" `
            --notes "NuGet packages published as ``$env:VERSION_PACKAGE``." `
            --generate-notes `
            --verify-tag
